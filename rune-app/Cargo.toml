[package]
name = "chatgpt"
version = "1.0.18"
edition = "2024"
description = "ChatGPT desktop app: Rune draws the UI, Edge WebView2 shows the page"
license = "ISC"

[build-dependencies]
winresource = "0.1"

[dependencies]
rune = { path = "../../rune-src/crates/rune" }
webview2-com = "0.38"
open = "5"
png = "0.17"
tauri-winrt-notification = "0.7"
url = "2"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

# Rune ships patched copies of four crates.io packages. A dependency's
# [patch] does not apply to the workspace that depends on it, so an app that
# builds Rune has to patch them too. Point these at a Rune checkout
# (github.com/anomalyco/rune, rev d8b3713e51bc2090f43e3dc7bb561f26518db513).
[patch.crates-io]
wgpu-hal = { path = "../../rune-src/vendor/wgpu-hal" }
winit = { path = "../../rune-src/vendor/winit" }
parley_engine = { path = "../../rune-src/vendor/parley_engine" }
accesskit_windows = { path = "../../rune-src/vendor/accesskit_windows" }
