name: Build ChatGPT installer

# Manual only: this builds and uploads an artifact. It never publishes or
# replaces a GitHub Release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
      # Rune is pre-release and pinned by revision. Never follow upstream main.
      RUNE_REV: d8b3713e51bc2090f43e3dc7bb561f26518db513

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rune-app/target
          key: ${{ runner.os }}-rune-${{ env.RUNE_REV }}-${{ hashFiles('rune-app/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rune-${{ env.RUNE_REV }}-

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      # rune-app depends on a sibling Rune checkout plus its vendored patches,
      # so CI clones exactly the pinned revision beside the repository.
      - name: Checkout Rune at the pinned revision
        shell: pwsh
        run: |
          git clone https://github.com/anomalyco/rune.git ../rune-src
          git -C ../rune-src fetch --depth 1 origin $env:RUNE_REV
          git -C ../rune-src checkout $env:RUNE_REV
          Write-Host "Rune at $(git -C ../rune-src rev-parse HEAD)"

      # A global CXX=g++ makes vswhom-sys emit a MinGW object link.exe rejects.
      - name: Clear the C/C++ compiler overrides
        shell: pwsh
        run: |
          "CC=" *>> $env:GITHUB_ENV
          "CXX=" *>> $env:GITHUB_ENV

      - name: Format
        working-directory: rune-app
        run: cargo fmt --check

      - name: Clippy
        working-directory: rune-app
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: rune-app
        run: cargo test --locked

      - name: Build release
        working-directory: rune-app
        run: cargo build --release --locked

      - name: Build the Rune installer
        working-directory: rune-app/installer
        shell: pwsh
        run: |
          makensis chatgpt.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }
          $setup = Get-ChildItem ../dist/ChatGPT_*_x64-setup.exe
          if (-not $setup) { throw "no installer was produced" }
          Write-Host "Installer: $($setup.FullName) ($($setup.Length) bytes)"

      - name: Verify the shipped binary is the Rune app
        working-directory: rune-app
        shell: pwsh
        run: |
          $exe = "target/release/chatgpt.exe"
          if (-not (Test-Path $exe)) { throw "$exe was not built" }
          $info = (Get-Item $exe).VersionInfo
          if ($info.ProductName -ne "ChatGPT") { throw "unexpected ProductName: $($info.ProductName)" }
          if ($info.FileVersion -ne "1.0.18") { throw "unexpected FileVersion: $($info.FileVersion)" }
          Get-FileHash $exe -Algorithm SHA256 | Format-List
          Get-FileHash (Get-ChildItem ../rune-app/dist/ChatGPT_*_x64-setup.exe).FullName -Algorithm SHA256 | Format-List

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-installer
          path: rune-app/dist/ChatGPT_*_x64-setup.exe
          if-no-files-found: error

  # The Tauri app in src-tauri/ is archived: it is kept for reference and for
  # regression comparison, and is deliberately not built here.
